<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Pardus HCL{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar {
            width: 200px;
            position: fixed;
            top: 56px; /* navbar yüksekliği */
            bottom: 0;
            overflow-y: auto;
            background-color: #f8f9fa;
            padding: 1rem;
        }
        .sidebar-left { left: 0; }
        .sidebar-right { right: 0; }
        .main-content {
            margin-left: 210px;
            margin-right: 210px;
            padding-top: 1rem;
        }
    </style>
</head>
<body>

<!-- Üst Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="{{ url_for('index') }}">
      <img src="{{ url_for('static', filename='par.png') }}" alt="Logo" width="128" height="35" class="me-2">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Ana Sayfa</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('list_jsons') }}">Bilgisayar Listesi</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Hakkımızda</a></li>
        <li class="nav-item"><a class="nav-link" href="#">İletişim</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Çözüm Merkezi</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Sol Sidebar -->
<div class="sidebar sidebar-left">
  <h5>Sol Menü</h5>
  <ul class="nav flex-column">
    <li class="nav-item"><a class="nav-link" href="#">Raporlar</a></li>
    <li class="nav-item"><a class="nav-link" href="#">Ayarlar</a></li>
    <li class="nav-item"><a class="nav-link" href="#">Yüklemeler</a></li>
  </ul>
</div>

<!-- Sağ Sidebar -->
<div class="sidebar sidebar-right">
  <h5>Yardım</h5>
  <ul class="nav flex-column">
    <li class="nav-item"><a class="nav-link" href="#">SSS</a></li>
    <li class="nav-item"><a class="nav-link" href="#">Destek</a></li>
    <li class="nav-item"><a class="nav-link" href="#">Geliştirici API</a></li>
  </ul>
</div>

<!-- Ana İçerik -->
<div class="main-content">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
